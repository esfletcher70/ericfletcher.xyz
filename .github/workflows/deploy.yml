name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires these GitHub secrets:
    #   CLOUDFLARE_API_TOKEN  - token with Workers Scripts:Edit for the account
    #   CLOUDFLARE_ACCOUNT_ID - a108878ef3240a46d86cd3883ec6abd4 (same as Otterly)
    #   DATABASE_URL          - Neon pooled Postgres connection string
    #   DATABASE_URL_UNPOOLED - Neon direct connection string (migrations); falls
    #                           back to DATABASE_URL if unset
    #   NEXTAUTH_SECRET       - NextAuth JWT secret
    #   NEXTAUTH_URL          - https://ericfletcher.xyz
    #   OTTERLY_API_URL       - https://otterly.work
    #   OTTERLY_API_KEY       - Otterly leads API bearer token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}

      - name: Build OpenNext output
        run: npx opennextjs-cloudflare build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          OTTERLY_API_URL: ${{ secrets.OTTERLY_API_URL }}
          OTTERLY_API_KEY: ${{ secrets.OTTERLY_API_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
