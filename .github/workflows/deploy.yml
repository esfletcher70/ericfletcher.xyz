name: Deploy to hosting.com

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build -- --no-lint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Prune to production dependencies
        run: npm prune --omit=dev --legacy-peer-deps

      - name: Package build artifact
        run: tar -czf ../deploy.tar.gz --exclude=.git --exclude=.github . && mv ../deploy.tar.gz ./deploy.tar.gz

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy.tar.gz
          target: /tmp

      - name: Extract archive and sync database schema (on server)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DATABASE_URL
          command_timeout: 10m
          script: |
            set -e
            APP_NAME=$(basename "${{ secrets.SSH_APP_PATH }}")
            source "/home/${{ secrets.SSH_USER }}/nodevenv/${APP_NAME}/20/bin/activate"
            mkdir -p "${{ secrets.SSH_APP_PATH }}"
            rm -rf "${{ secrets.SSH_APP_PATH }}"/.next "${{ secrets.SSH_APP_PATH }}"/node_modules
            tar -xzf /tmp/deploy.tar.gz -C "${{ secrets.SSH_APP_PATH }}"
            rm -f /tmp/deploy.tar.gz
            cd "${{ secrets.SSH_APP_PATH }}"
            node node_modules/.bin/prisma db push --skip-generate

      - name: Restart app (Passenger)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ secrets.SSH_APP_PATH }}/tmp
            touch ${{ secrets.SSH_APP_PATH }}/tmp/restart.txt
