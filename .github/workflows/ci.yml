name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          # Placeholders are fine — the build never connects, it only needs the
          # vars to be present. Real values are injected in deploy.yml.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://u:p@placeholder.neon.tech/db' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-placeholder' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://ericfletcher.xyz' }}
